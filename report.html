<!DOCTYPE html>
<html>
<head>
  <title>PhysioAI Report</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f6f8;
    }

    .container {
      background: #fff;
      padding: 20px;
      border: 2px solid #000;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .brand {
      text-align: center;
      font-size: 13px;
      color: #2e7d32;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }

    td, th {
      border: 1px solid #000;
      padding: 6px;
      text-align: left;
    }

    .section-title {
      background: #e8f5e9;
      font-weight: bold;
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      text-align: right;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">GPNV CREATIONS</div>
  <h1>PHYSIOAI MEDICAL REPORT</h1>

  <!-- DATE -->
  <table>
    <tr>
      <td>Date</td>
      <td id="date"></td>
      <td>Time</td>
      <td id="time"></td>
    </tr>
  </table>

  <!-- PATIENT DETAILS -->
  <table>
    <tr class="section-title"><td colspan="4">PATIENT DETAILS</td></tr>
    <tr>
      <td>Name</td>
      <td id="name"></td>
      <td>Age</td>
      <td id="age"></td>
    </tr>
    <tr>
      <td>Email</td>
      <td id="email"></td>
      <td>Phone</td>
      <td id="phone"></td>
    </tr>
  </table>

  <!-- INJURY DETAILS -->
  <table>
    <tr class="section-title"><td colspan="4">INJURY DETAILS</td></tr>
    <tr>
      <td>Injury Area</td>
      <td id="injury"></td>
      <td>Cause</td>
      <td id="cause"></td>
    </tr>
    <tr>
      <td>Difficulty</td>
      <td id="difficulty"></td>
      <td>Weight</td>
      <td id="weight"></td>
    </tr>
  </table>

  <!-- SESSION SUMMARY -->
  <table>
    <tr class="section-title"><td colspan="4">SESSION SUMMARY</td></tr>
    <tr>
      <td>Total Sessions</td>
      <td id="totalSessions"></td>
      <td>Avg Accuracy</td>
      <td id="avgAcc"></td>
    </tr>
    <tr>
      <td>Total Reps</td>
      <td id="totalReps"></td>
      <td>Status</td>
      <td id="status"></td>
    </tr>
  </table>

  <!-- SESSION TABLE -->
  <table>
    <tr class="section-title">
      <td>Date</td>
      <td>Exercise</td>
      <td>Accuracy</td>
      <td>Reps</td>
      <td>Wrong</td>
      <td>Pain</td>
      <td>Fatigue</td>
    </tr>
    <tbody id="sessionTable"></tbody>
  </table>

  <div class="footer">
    Doctor Signature: ______________________
  </div>

</div>

<!-- PDF LIB -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

// 📅 DATE
const now = new Date();
document.getElementById("date").innerText = now.toLocaleDateString("en-GB");
document.getElementById("time").innerText = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

// 🔥 GET DATA
const user = JSON.parse(localStorage.getItem("pu") || "{}");
const profile = JSON.parse(localStorage.getItem("profile") || "{}");
const sessions = JSON.parse(localStorage.getItem("ps") || "[]");

// ✅ NAME FIX (FINAL)
document.getElementById("name").innerText =
  user.name || user.username || user.email || "User";

// PATIENT
document.getElementById("email").innerText = user.email || "-";
document.getElementById("phone").innerText = user.phone || "-";

// PROFILE
document.getElementById("age").innerText = profile.age || "-";
document.getElementById("injury").innerText = profile.injury_area || "-";
document.getElementById("cause").innerText = profile.cause || "-";
document.getElementById("difficulty").innerText = profile.difficulty || "Easy";
document.getElementById("weight").innerText = profile.weight_kg || "-";

// CALCULATIONS
let totalReps = 0, totalAcc = 0;

sessions.forEach(s => {
  totalReps += s.reps || 0;
  totalAcc += s.acc || 0;
});

const avgAcc = sessions.length
  ? Math.round(totalAcc / sessions.length)
  : 0;

// SUMMARY
document.getElementById("totalSessions").innerText = sessions.length;
document.getElementById("avgAcc").innerText = avgAcc + "%";
document.getElementById("totalReps").innerText = totalReps;

// STATUS
let status = "Good";
if(totalReps === 0) status = "No Activity";
else if(totalReps < 20) status = "Low";
else if(totalReps < 50) status = "Moderate";

document.getElementById("status").innerText = status;

// TABLE
const table = document.getElementById("sessionTable");

sessions.forEach(s => {
  const row = `
    <tr>
      <td>${new Date(s.date).toLocaleDateString()}</td>
      <td>${s.exercise}</td>
      <td>${s.acc}%</td>
      <td>${s.reps || 0}</td>
      <td>${s.wrong || 0}</td>
      <td>${s.pain || 0}</td>
      <td>${s.fat || 0}</td>
    </tr>
  `;
  table.innerHTML += row;
});

// PDF DOWNLOAD
function downloadPDF(){
  const element = document.querySelector(".container");
  html2pdf().from(element).save("PhysioAI_Report.pdf");
}

// 🚀 AUTO DOWNLOAD (DIRECT)
window.onload = function(){
  setTimeout(() => {
    downloadPDF();
  }, 500);
};

</script>

</body>
</html>
